#
# Steward — Cloudflare Worker configuration
#
# NON-NEGOTIABLE: the default (top-level) bindings in this file point at PREVIEW
# resources ONLY. Production D1 and R2 hold real EINs, audited financial
# statements, and operating budgets belonging to other organizations.
#
# There is deliberately NO usable production binding in this file. The
# [env.production] block below carries placeholder IDs that will fail loudly.
# A human fills them in, in a named deploy step, at the moment of deploy.
# Do not commit real production IDs here.
#
name = "steward"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Hostname surface ---------------------------------------------------------
# Explicit rather than defaulted, because each of these is a PUBLIC HOSTNAME and
# every hostname is something Cloudflare Access has to be put in front of
# separately.
#
# workers.dev is OFF. grants.houstontexansfoundation.org is the only hostname
# this Worker answers on, and one hostname is one surface to reason about.
#
# Preview URLs are OFF. They mint a NEW hostname per deployed version
# (<version>-steward.<subdomain>.workers.dev). An Access policy attached to the
# main hostname does not cover them, so leaving them on quietly creates a way
# around Access. The Worker still verifies the Access assertion itself and would
# reject unauthenticated requests on any hostname -- but that is defence in
# depth, not a reason to leave an extra door open.
#
# NOTE ON PLACEMENT: these are TOP-LEVEL keys and must stay above the first
# [table] header. TOML assigns every key after a header to that table, so
# putting them lower silently makes them "unexpected fields in observability"
# and the setting never applies.
workers_dev = false
preview_urls = false

# The real hostname. A subdomain rather than the apex, so the apex stays free
# for the public "who we funded" page (Module 8) without that page and the
# application portal sharing an origin, a CSP, or an Access policy.
#
# Declared here rather than clicked in the dashboard so the hostname is in
# version control: a public hostname that exists only as a dashboard setting is
# a hostname nobody reviews.
#
# Verified working behind Access before workers_dev was turned off. Doing it in
# the other order leaves no way in if the custom domain misbehaves.
routes = [
  { pattern = "grants.houstontexansfoundation.org", custom_domain = true }
]

[observability]
enabled = true

# --- Static assets: the built single-page app ---------------------------------
# `npm run build:web` compiles web/ into ./public. Cloudflare's asset router
# serves anything that matches a file there BEFORE this Worker is invoked, so
# the hashed JS and CSS never cost a Worker invocation. Everything else --
# /api/*, /health, and the app's own deep links -- reaches the Worker.
#
# not_found_handling is left at its default ("none") deliberately: the Worker
# decides which unmatched paths are app routes and which are genuinely 404,
# rather than every mistyped URL silently returning the app shell.
#
# The directory is committed with only public/.assetsignore in it, so a fresh
# clone can run `wrangler dev` and the test suite before anything has been
# built. Wrangler never uploads .assetsignore, so nothing extra is served.
[assets]
directory = "./public"
binding = "ASSETS"


[vars]
ENVIRONMENT = "preview"
# Display timezone for all human-facing dates. Storage is always UTC.
DISPLAY_TIMEZONE = "America/Chicago"
# Cloudflare Access. Fill both in once the Access application exists; until then
# every staff route fails closed. Neither is a secret.
ACCESS_TEAM_DOMAIN = "texansdigital.cloudflareaccess.com"
ACCESS_AUD = "25afd7973df7c8d398d252df5aa7b5886bdff3b54b34168b3a752b24dda7b15d"
# Outbound email. Both are public addresses, not secrets. The RESEND_API_KEY
# that makes them do anything is a Wrangler secret and is deliberately unset in
# preview, so a preview run records sends as 'suppressed' and mails nobody.
EMAIL_FROM = "Houston Texans Foundation <grants@houstontexansfoundation.org>"
EMAIL_REPLY_TO = "grants@houstontexansfoundation.org"
# Where applicants sign in. Sign-in links are built from THIS value, never from
# the request's Host header -- a Host is attacker-controlled, and a magic link
# built from one would send an applicant to an address of the attacker's
# choosing carrying a live token.
APPLICANT_BASE_URL = "https://applications.houstontexansfoundation.org"
# Turnstile / Resend / Eloqua / R2 signing credentials are Wrangler SECRETS.
# They are never listed here. See docs/SECRETS.md.

# --- PREVIEW D1 (default) -----------------------------------------------------
# Both ids point at the preview database on purpose. If someone runs a migration
# or a data script with the default config, it hits preview, never production.
[[d1_databases]]
binding = "DB"
database_name = "steward-preview"
database_id = "f5be3d5c-642c-4706-b9e6-bdd8e0c9858e"
preview_database_id = "f5be3d5c-642c-4706-b9e6-bdd8e0c9858e"
migrations_dir = "migrations"

# --- PREVIEW R2 (default) -----------------------------------------------------
# Private bucket. Objects are reached only through short-lived presigned URLs.
[[r2_buckets]]
binding = "FILES"
bucket_name = "steward-preview-files"
preview_bucket_name = "steward-preview-files"

# --- PREVIEW KV (sessions + magic-link tokens) --------------------------------
[[kv_namespaces]]
binding = "SESSIONS"
id = "212f8367ee404685853a0125b8c9f46d"
preview_id = "212f8367ee404685853a0125b8c9f46d"

# ==============================================================================
# STAGING — where REAL data goes before production exists.
#
# Decision #12: the friendly-organization test and any import of real past
# applications land here, NOT in preview. Preview is the database that
# seed:preview and admin:apply are pointed at with --remote; running a
# destructive script against real EINs and audited financial statements is the
# spirit of non-negotiable #2 inverted, even though that rule names production.
#
# Deployed deliberately:  wrangler deploy --env staging
# Migrated deliberately:  wrangler d1 migrations apply steward-staging --remote --env staging
#
# The ids below are placeholders until a human creates the resources. They fail
# loudly rather than silently falling back to preview, and checkConfig asserts
# they are never equal to the preview ids.
# ==============================================================================
[env.staging]
name = "steward-staging"

# EMPTY ON PURPOSE. Without this, wrangler INHERITS the top-level `routes` and a
# `--env staging` deploy reassigns grants.houstontexansfoundation.org to the
# staging Worker -- taking the live staff application offline and pointing the
# hostname at a database that does not have the real data in it. wrangler warns
# about this; checkConfig now refuses it, because a warning in a deploy log is
# read once and a failing build is read every time.
#
# Staging is reached by `wrangler dev --env staging` and by direct D1 and R2
# commands. It deliberately has no public hostname: there is nothing to serve
# from it that anyone should reach over the internet.
routes = []

[env.staging.vars]
ENVIRONMENT = "staging"
DISPLAY_TIMEZONE = "America/Chicago"
# Staging has NO hostname and therefore no Access application. Both values are
# empty, which makes every staff route fail CLOSED. That is the correct posture
# for an environment reached only by CLI: nothing is served from it, so nothing
# needs to authenticate against it.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Staging must never mail anyone: the friendly-organization fixtures in this
# database carry addresses that reach real people. No key is set, and an empty
# EMAIL_FROM makes a send throw rather than silently pick a default.
EMAIL_FROM = ""
EMAIL_REPLY_TO = ""
APPLICANT_BASE_URL = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "steward-staging"
database_id = "6c300d84-a3a3-45b8-a9f7-a13f8067d9a7"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "steward-staging-files"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "a7b016bfcca94300be98cf3f992ba9c8"

# ==============================================================================
# PRODUCTION — deliberate, human-run deploy step only.
#
#   wrangler deploy --env production
#
# The placeholder ids below are intentionally invalid. Filling them in is a
# conscious act by a human who has decided to touch production. Never run
# `wrangler d1 migrations apply --env production` casually, and never run a
# data-mutating script against it without being told to in that same message.
# ==============================================================================
[env.production]
name = "steward-production"

# EMPTY, like staging, and for the same reason: without this, deploying
# production REASSIGNS grants.houstontexansfoundation.org away from the Worker
# currently serving it. The production hostname is a deliberate choice a human
# makes at cutover, alongside the ids below -- not something inherited by
# accident from the environment it is meant to replace.
routes = []

[env.production.vars]
ENVIRONMENT = "production"
DISPLAY_TIMEZONE = "America/Chicago"
EMAIL_FROM = "Houston Texans Foundation <grants@houstontexansfoundation.org>"
EMAIL_REPLY_TO = "grants@houstontexansfoundation.org"
APPLICANT_BASE_URL = "https://applications.houstontexansfoundation.org"

[[env.production.d1_databases]]
binding = "DB"
database_name = "steward-production"
database_id = "FILL_IN_AT_DEPLOY_TIME_DO_NOT_COMMIT"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "FILL_IN_AT_DEPLOY_TIME_DO_NOT_COMMIT"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "FILL_IN_AT_DEPLOY_TIME_DO_NOT_COMMIT"
